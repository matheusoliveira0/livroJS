<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Capitulo #5</title>
</head>

<body>
    <div id="box-title">
        <h1>Exercício #5_5</h1>
        <h2>Livro Lógica de programação e algoritmos com JavaScript</h2>
    </div>
    <div id="main-box">
        <img src="img/cofrinho.jpg" alt="Números" class="normal">
        <div class="boxForm">
            <form>
                <h3>Programa Contas do mês</h3>

                <p>
                    Descrição da conta:
                    <input type="text" id="inDescricao" required>
                </p>
                <p>
                    Número:
                    <input type="number" id="inNum" step="0.01" min="0" required>
                </p>
                <input type="submit" value="Registrar" class="btn">
            </form>

            <pre id="resp1"></pre>
            <pre id="resp2"></pre>
        </div>

    </div>


</body>
